# OxygenX 设计令牌真源 — 排版
# P3 组件渲染所需；以下取值全部是 E0 占位，不是 OxygenOS 的复刻值。
# 字段：size / lineHeight（sp）、weight（1..1000）、letterSpacing（sp）、family（通用字族名）。
# family 只允许通用字族，不引用任何厂商专有字体文件。
